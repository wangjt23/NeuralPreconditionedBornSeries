train:
  save_dir: "./outputs/2d/openfwi/CurveFault_B/cbs_gmres_green"

model:
  boundary_layer: pbl
  boundary_width: 32
  name: cbs
  data_type: openfwi_CurveFault_B

inference:
  fdtype: float64
  max_num_iters: 10000
  test_point: 6000
  num_test: 50
  tol: 1e-6
  solver_type: krylov
  cbs_krylov_preconditioner: green
  krylov_maxiter: 10000
  krylov_restart: 100
  krylov_max_restarts: 100
  krylov_log_step: 50
  krylov_verbose: true
