model:
  boundary_width: 32
  boundary_type: pbl
  name: pafno_bs
  u_channels_list: [5, 15, 20, 25, 30]
  a_channels_list: [10, 20, 30, 32, 32]
  mg_sweeps_lvls: [1, 2, 4, 8, 8]
  data_type : 'openfwi_CurveFault_B'
  loss_type: 2 # L2 loss 1, L2 precond loss 2, R precond loss 3

inference:
  fdtype: float64
  print_step: 50
  max_num_iters: 2500
  test_point: 6000 # Starting point index for test data
  num_test: 20
  tol: 1e-6
  solver_type: krylov
  krylov_maxiter: 500
  krylov_restart: 50 # Arnoldi subspace size per GMRES cycle; set smaller than krylov_maxiter to enable restart
  krylov_max_restarts: 10 # number of restart cycles after the first GMRES cycle
  krylov_log_step: 50
  krylov_verbose: true
