## train
train:
  num_epochs: 400
  val_steps: 1 # how many epochs to run validation
  log_steps: 25 # number of batch steps to print
  # num_iters: 10 # number of inner iterations when validate model's performance
  batch_size: 30
  save_dir: "./outputs/2d/openfwi/CurveFault_B/ppw12/pafno_bs_nopreloss"
  lr: 1e-3
  lr_gamma: 0.8
  lr_step_size: 20
  num_train: 3000
  num_test: 100
  val_point: 6000
## finetune
