## train
train:
  num_epochs: 200
  val_steps: 10 # how many epochs to run validation
  log_steps: 25 # number of batch steps to print
  batch_size: 30
  save_dir: "./outputs/2d/openfwi/CurveFault_B/ppw12/mgcfnn_bs_pre_400ep"
  lr: 1e-3
  lr_gamma: 0.8
  lr_step_size: 10
  num_train: 3000
  num_test: 100
  val_point: 4000

model:
  boundary_width: 32
  boundary_type: pbl
  name: mgcfnn_bs
  data_type: 'openfwi_CurveFault_B'
  loss_type: 3 # L2 loss 1, L2 precond loss 2, R precond loss 3

inference:
  fdtype: float64
  print_step: 50
  max_num_iters: 2500
  test_point: 4000
  num_test: 10
  tol: 1e-6
