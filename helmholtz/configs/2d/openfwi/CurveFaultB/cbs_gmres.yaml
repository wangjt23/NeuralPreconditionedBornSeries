train:
  save_dir: "./outputs/2d/openfwi/CurveFault_B/cbs_gmres"

model:
  boundary_layer: pbl
  boundary_width: 32
  name: cbs
  data_type: openfwi_CurveFault_B

inference:
  fdtype: float64
  max_num_iters: 10000
  test_point: 6000 # Starting point index for test data
  num_test: 50
  tol: 1e-6
  solver_type: krylov
  krylov_maxiter: 10000
  krylov_restart: 100 # Arnoldi subspace size per GMRES cycle; set smaller than krylov_maxiter to enable restart
  krylov_max_restarts: 100 # number of restart cycles after the first GMRES cycle
  krylov_log_step: 50
  krylov_verbose: true
