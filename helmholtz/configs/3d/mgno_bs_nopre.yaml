# Source experiment preset; see helmholtz/README.md for assumptions.
train:
  num_epochs: 200
  val_steps: 5
  log_steps: 10
  batch_size: 2
  save_dir: outputs/helmholtz/3d/openfwi/mgno_bs_nopre
  lr: 5e-4
  lr_gamma: 0.8
  lr_step_size: 20
  num_train: 600
  num_test: 50
  val_point: 6000
model:
  boundary_width: 16
  boundary_type: pbl
  name: mgno_bs_3d
  data_type: openfwi3d
  loss_type: 1
  num_channel_u: 32
  activation: gelu
inference:
  fdtype: float64
  print_step: 10
  max_num_iters: 500
  test_point: 6000
  num_test: 50
  tol: 1e-6
